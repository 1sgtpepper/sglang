name: Lifecycle correctness validation

on:
  push:
    branches: [validation/lifecycle-correctness]
    paths:
      - .github/workflows/lifecycle-correctness-validation.yml
      - .github/lifecycle-environment.txt
      - test/manual/replayssm_retraction.py
      - test/manual/beam_retirement_order.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, linux, x64, lifecycle-validation]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/python
      OMP_NUM_THREADS: "1"
      MAX_JOBS: "1"
      CC: /usr/bin/gcc-15
      CXX: /usr/bin/g++-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the clean pinned runtime
        run: |
          set -o pipefail
          mkdir -p evidence
          python - <<'PY' | tee evidence/environment-verification.log
          import importlib.metadata as metadata
          import json
          from pathlib import Path
          import sys
          from packaging.requirements import Requirement

          assert sys.version_info[:2] == (3, 12)
          prefix = Path(sys.prefix).absolute()
          distributions = list(metadata.distributions())
          assert all(Path(d.locate_file("")).absolute().is_relative_to(prefix)
                     for d in distributions), "An inherited package environment is not permitted"
          checked = 0
          for line in Path(".github/lifecycle-environment.txt").read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              required = Requirement(line)
              actual = metadata.distribution(required.name)
              assert required.specifier.contains(actual.version, prereleases=True), required.name
              if required.url is not None:
                  assert required.name == "cuda-tile" and actual.version == "1.6.0rc5"
                  direct = json.loads(actual.read_text("direct_url.json"))
                  assert direct["url"] == "https://pypi.nvidia.com/cuda-tile/cuda_tile-1.6.0rc5-cp312-cp312-manylinux2014_x86_64.whl"
              checked += 1
          assert checked == 202
          print({"python": sys.version, "prefix": str(prefix), "verified_packages": checked,
                 "inherited_distribution_roots": 0})
          PY
          uv pip check --python "$(command -v python)" 2>&1 | tee evidence/dependency-check.log
          uv pip freeze --python "$(command -v python)" > evidence/packages.txt
          python -m sglang.check_env > evidence/check-env.txt 2>&1
      - name: Inspect runtime imports
        run: |
          python - <<'PY'
          import torch, triton
          assert torch.__version__ == "2.13.0+cu130"
          assert triton.__version__ == "3.7.1"
          print({"torch": torch.__version__, "triton": triton.__version__,
                 "cuda": torch.version.cuda, "gpu": torch.cuda.get_device_name()})
          from sglang.srt.mem_cache.memory_pool import MambaPool, HybridReqToTokenPool
          from sglang.srt.beam_search.coordinator import BeamCoordinator
          print("Production pool and beam coordinator imports passed.")
          PY
      - name: Check recurrent state across backup and restore
        run: python test/manual/replayssm_retraction.py --case matrix 2>&1 | tee evidence/recurrence-matrix.log
      - name: Check beam retirement ordering
        if: ${{ !cancelled() }}
        run: python test/manual/beam_retirement_order.py --case matrix 2>&1 | tee evidence/beam-matrix.log
      - name: Check standalone baseline failures and causal controls
        run: |
          python - <<'PY' | tee evidence/standalone-contrasts.log
          import subprocess
          import sys

          cases = [
              ("replayssm_retraction.py", [], 1, "Accepted recurrence was lost"),
              ("replayssm_retraction.py", ["--case", "materialize"], 0, None),
              ("beam_retirement_order.py", [], 1, "Retired beam work overwrote"),
              ("beam_retirement_order.py", ["--case", "late"], 0, None),
          ]
          for script, args, expected_exit, expected_error in cases:
              result = subprocess.run(
                  [sys.executable, "test/manual/" + script, *args],
                  text=True, capture_output=True, timeout=90,
              )
              print(result.stdout, end="")
              print(result.stderr, end="")
              assert result.returncode == expected_exit, (script, result.returncode)
              if expected_error:
                  assert expected_error in result.stderr, (script, result.stderr)
              print(f"{script} {args}: expected exit {expected_exit} confirmed")
          PY
      - name: Preserve the replay environment and results
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git diff --exit-code -- python
          cp .github/lifecycle-environment.txt evidence/
          cp test/manual/replayssm_retraction.py test/manual/beam_retirement_order.py evidence/
          find evidence -type f -exec sha256sum {} + > checksums.txt
          tar -czf lifecycle-evidence.tar.gz evidence checksums.txt
          sha256sum lifecycle-evidence.tar.gz
          echo 'BEGIN_LIFECYCLE_EVIDENCE_BASE64'
          base64 -w 76 lifecycle-evidence.tar.gz
          echo 'END_LIFECYCLE_EVIDENCE_BASE64'
