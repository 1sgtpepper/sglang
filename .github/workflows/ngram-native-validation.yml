name: NGRAM native validation
on:
  push:
    branches: [validation/ngram-cached-miss]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay baseline and patched native behavior
        env:
          CXX: ${{ matrix.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          "$CXX" --version
          src=python/sglang/kernels/jit/csrc/ngram_corpus
          tests=test/ngram-native-validation
          mkdir -p /tmp/ngram-validation
          for variant in baseline patched; do
            if [[ "$variant" == patched ]]; then
              git apply --unidiff-zero --check "$tests/cached-miss.patch"
              git apply --unidiff-zero "$tests/cached-miss.patch"
            fi
            for test in runtime_repro regression causal; do
              binary="/tmp/ngram-validation/$variant-$test"
              "$CXX" -std=c++20 -O2 -pthread -I "$src" \
                "$tests/$test.cc" "$src/ngram.cpp" "$src/trie.cpp" \
                "$src/result.cpp" "$src/suffix_automaton.cpp" -o "$binary"
              status=0
              timeout 60 "$binary" "$variant" > "$binary.log" 2>&1 || status=$?
              cat "$binary.log"
              if [[ "$test" == causal ]]; then
                test "$status" -eq 0
                grep -Fx "null-only interventions=6 negative-controls=2 passed" "$binary.log"
              elif [[ "$variant" == baseline ]]; then
                test "$status" -eq 1
                if [[ "$test" == runtime_repro ]]; then
                  grep -Fx 'BFS cached=30,70,80,90, fresh=30,40,50,60, FAIL: newly inserted longest match is omitted' "$binary.log"
                  grep -Fx 'PROB cached=30,70,80,90, fresh=30,40,50,60, FAIL: newly inserted longest match is omitted' "$binary.log"
                else
                  grep -Fx 'checks=33500 failures=2790' "$binary.log"
                fi
              else
                test "$status" -eq 0
                if [[ "$test" == runtime_repro ]]; then
                  grep -Fx 'BFS cached=30,40,50,60, fresh=30,40,50,60, PASS' "$binary.log"
                  grep -Fx 'PROB cached=30,40,50,60, fresh=30,40,50,60, PASS' "$binary.log"
                else
                  grep -Fx 'checks=35352 failures=0' "$binary.log"
                fi
              fi
            done
          done
      - name: Check patched native behavior with sanitizers
        if: matrix.compiler == 'clang++'
        shell: bash
        run: |
          set -euo pipefail
          src=python/sglang/kernels/jit/csrc/ngram_corpus
          clang++ -std=c++20 -O1 -g -pthread -fsanitize=address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer -I "$src" \
            test/ngram-native-validation/regression.cc "$src/ngram.cpp" \
            "$src/trie.cpp" "$src/result.cpp" "$src/suffix_automaton.cpp" \
            -o /tmp/ngram-validation/sanitized
          timeout 60 /tmp/ngram-validation/sanitized

  python:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MAX_JOBS: '2'
      CARGO_BUILD_JOBS: '2'
      SGLANG_USE_CPU_ENGINE: '1'
      UV_SYSTEM_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v5
      - name: Install repository dependencies
        timeout-minutes: 25
        run: |
          bash scripts/ci/utils/install_rust_protoc.sh
          uv pip install -e "python[dev]" --index-strategy unsafe-best-match --prerelease allow
      - name: Execute baseline and patched Python FFI regression
        shell: bash
        run: |
          set -euo pipefail
          candidate=17b250829c15b11563c0ff6098c97962ec6c2aa7
          environment_status=0
          python -m sglang.check_env > /tmp/ngram-environment.log 2>&1 || environment_status=$?
          echo "Environment probe exit: $environment_status"
          cat /tmp/ngram-environment.log
          python -c 'import importlib.metadata as m, platform; print("Runtime:", platform.platform(), platform.python_version()); print({p: m.version(p) for p in ("sglang", "torch", "apache-tvm-ffi", "numpy")})'
          status=0
          python test/ngram-native-validation/issue_repro.py > /tmp/issue-baseline.log 2>&1 || status=$?
          cat /tmp/issue-baseline.log
          test "$status" -eq 1
          grep -Fx 'BFS: cached=[30, 70, 80, 90], fresh=[30, 40, 50, 60], after_erasure=[30, 40, 50, 60]' /tmp/issue-baseline.log
          grep -Fx 'PROB: cached=[30, 70, 80, 90], fresh=[30, 40, 50, 60], after_erasure=[30, 40, 50, 60]' /tmp/issue-baseline.log
          grep -Fx 'AssertionError: cached request omits newly inserted longer context' /tmp/issue-baseline.log
          git fetch --no-tags origin "$candidate"
          git show "$candidate:test/registered/unit/spec/test_ngram_corpus.py" > test/registered/unit/spec/test_ngram_corpus.py
          status=0
          python -m pytest -q test/registered/unit/spec/test_ngram_corpus.py::TestNgramCorpusIncremental::test_cached_miss_becomes_match_after_insert > /tmp/candidate-baseline.log 2>&1 || status=$?
          cat /tmp/candidate-baseline.log
          test "$status" -eq 1
          grep -F 'Arrays are not equal' /tmp/candidate-baseline.log
          python test/ngram-native-validation/downstream.py baseline
          status=0
          python -m pytest -q test/ngram-native-validation/ffi_regression.py > /tmp/baseline-ffi.log 2>&1 || status=$?
          cat /tmp/baseline-ffi.log
          test "$status" -eq 1
          grep -F 'Arrays are not equal' /tmp/baseline-ffi.log
          git apply --unidiff-zero test/ngram-native-validation/cached-miss.patch
          python test/ngram-native-validation/downstream.py patched
          python -m pytest -q test/ngram-native-validation/ffi_regression.py
          cp -a test/ngram-native-validation "$RUNNER_TEMP/ngram-final-harness"
          git checkout --force --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          python "$RUNNER_TEMP/ngram-final-harness/issue_repro.py"
          python -m pytest -q -rs test/registered/unit/spec/test_ngram_corpus.py
          python "$RUNNER_TEMP/ngram-final-harness/downstream.py" patched
          src=python/sglang/kernels/jit/csrc/ngram_corpus
          clang++ -std=c++20 -O1 -g -pthread -fsanitize=address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer -I "$src" \
            "$RUNNER_TEMP/ngram-final-harness/regression.cc" "$src/ngram.cpp" \
            "$src/trie.cpp" "$src/result.cpp" "$src/suffix_automaton.cpp" \
            -o /tmp/ngram-final-sanitized
          timeout 60 /tmp/ngram-final-sanitized

  compare:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned source revision
        run: git fetch --no-tags origin bd16c22a04b0eb9bc2e775795bda6b11727a5d38
      - name: Compare correct fixes against native behavior and timing
        run: python3 test/ngram-native-validation/compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: ngram-fix-comparison
          path: comparison-results/comparison.json
          if-no-files-found: error
