name: NGRAM native validation
on:
  push:
    branches: [validation/ngram-cached-miss]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay baseline and patched native behavior
        env:
          CXX: ${{ matrix.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          "$CXX" --version
          src=python/sglang/kernels/jit/csrc/ngram_corpus
          tests=test/ngram-native-validation
          mkdir -p /tmp/ngram-validation
          for variant in baseline patched; do
            if [[ "$variant" == patched ]]; then
              git apply --unidiff-zero --check "$tests/cached-miss.patch"
              git apply --unidiff-zero "$tests/cached-miss.patch"
            fi
            for test in runtime_repro regression; do
              binary="/tmp/ngram-validation/$variant-$test"
              "$CXX" -std=c++20 -O2 -pthread -I "$src" \
                "$tests/$test.cc" "$src/ngram.cpp" "$src/trie.cpp" \
                "$src/result.cpp" "$src/suffix_automaton.cpp" -o "$binary"
              status=0
              timeout 60 "$binary" > "$binary.log" 2>&1 || status=$?
              cat "$binary.log"
              if [[ "$variant" == baseline ]]; then
                test "$status" -eq 1
                if [[ "$test" == runtime_repro ]]; then
                  grep -Fx 'BFS cached=30,70,80,90, fresh=30,40,50,60, FAIL: newly inserted longest match is omitted' "$binary.log"
                  grep -Fx 'PROB cached=30,70,80,90, fresh=30,40,50,60, FAIL: newly inserted longest match is omitted' "$binary.log"
                else
                  grep -Fx 'checks=33500 failures=2790' "$binary.log"
                fi
              else
                test "$status" -eq 0
                if [[ "$test" == runtime_repro ]]; then
                  grep -Fx 'BFS cached=30,40,50,60, fresh=30,40,50,60, PASS' "$binary.log"
                  grep -Fx 'PROB cached=30,40,50,60, fresh=30,40,50,60, PASS' "$binary.log"
                else
                  grep -Fx 'checks=35352 failures=0' "$binary.log"
                fi
              fi
            done
          done
      - name: Check patched native behavior with sanitizers
        if: matrix.compiler == 'clang++'
        shell: bash
        run: |
          set -euo pipefail
          src=python/sglang/kernels/jit/csrc/ngram_corpus
          clang++ -std=c++20 -O1 -g -pthread -fsanitize=address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer -I "$src" \
            test/ngram-native-validation/regression.cc "$src/ngram.cpp" \
            "$src/trie.cpp" "$src/result.cpp" "$src/suffix_automaton.cpp" \
            -o /tmp/ngram-validation/sanitized
          timeout 60 /tmp/ngram-validation/sanitized

  python:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MAX_JOBS: '2'
      CARGO_BUILD_JOBS: '2'
      SGLANG_USE_CPU_ENGINE: '1'
      UV_SYSTEM_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v5
      - name: Install repository dependencies
        timeout-minutes: 25
        run: |
          bash scripts/ci/utils/install_rust_protoc.sh
          uv pip install -e "python[dev]" --index-strategy unsafe-best-match --prerelease allow
      - name: Execute baseline and patched Python FFI regression
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m pytest -q test/ngram-native-validation/ffi_regression.py > /tmp/baseline-ffi.log 2>&1 || status=$?
          cat /tmp/baseline-ffi.log
          test "$status" -eq 1
          grep -F 'Arrays are not equal' /tmp/baseline-ffi.log
          git apply --unidiff-zero test/ngram-native-validation/cached-miss.patch
          python -m pytest -q test/ngram-native-validation/ffi_regression.py
          python -m pytest -q test/registered/unit/spec/test_ngram_corpus.py
