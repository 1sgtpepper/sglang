name: Validate ragged top-k

on:
  push:
    branches:
      - validate/ragged-topk-mask

jobs:
  focused-regression:
    runs-on: 1-gpu-h100
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          CUSTOM_BUILD_SGL_KERNEL=true bash scripts/ci/cuda/ci_install_dependency.sh diffusion

      - name: Run focused regression
        env:
          PYTHONPATH: python
        run: |
          python3 -m pytest \
            test/registered/kernels/ops/attention/test_topk_v2.py \
            -k extreme_scores_do_not_escape_window -q
