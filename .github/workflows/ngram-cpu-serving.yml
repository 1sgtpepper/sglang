name: NGRAM CPU serving validation
on:
  push:
    branches: [validation/ngram-cpu-serving]
permissions:
  contents: read
env:
  SGLANG_USE_CPU_ENGINE: '1'
  UV_SYSTEM_PYTHON: '1'
  CARGO_BUILD_JOBS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '1'
  MAX_JOBS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  serving:
    if: github.repository == '1sgtpepper/sglang'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check required serving hardware
        run: |
          mkdir -p "$RUNNER_TEMP/ngram-serving-results"
          lscpu | tee "$RUNNER_TEMP/ngram-serving-results/cpu.txt"
          python3 - <<'PYCODE'
          from pathlib import Path
          flags = Path("/proc/cpuinfo").read_text().split("flags", 1)[1].splitlines()[0].split()
          assert {"amx_tile", "amx_bf16"}.issubset(flags), "runner lacks required AMX hardware"
          PYCODE
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject_cpu.toml'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ngram-serving-target-7ae557604adf67be50417f59c2c2f167def9a775
      - name: Select documented CPU packaging
        run: |
          cp python/pyproject_cpu.toml python/pyproject.toml
          cp python/sglang/kernels/aot/pyproject_cpu.toml python/sglang/kernels/aot/pyproject.toml
      - uses: ./.github/actions/download-rust-ext
        id: rust_ext
      - name: Install Rust toolchain on cache miss
        if: steps.rust_ext.outputs.hit != 'true'
        run: bash scripts/ci/utils/install_rust_protoc.sh
      - uses: Swatinem/rust-cache@v2
        if: steps.rust_ext.outputs.hit != 'true'
        with:
          workspaces: rust
          shared-key: sglang-ngram-cpu-torch212
          cache-on-failure: true
      - name: Install CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnuma-dev numactl libgoogle-perftools-dev libtbb-dev
          uv pip install -e python 'apache-tvm-ffi==0.1.11' 'scikit-build-core>=0.10' wheel --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match --prerelease allow
          lscpu
          python -c 'import torch; print(torch.__version__, dict(torch.cpu.get_capabilities())); assert torch.version.cuda is None; assert torch.cpu._is_amx_tile_supported()'
      - uses: actions/cache/restore@v4
        id: cpu_wheel
        with:
          path: ${{ runner.temp }}/cpu-wheels
          key: ngram-cpu-cp310-torch212-${{ hashFiles('python/sglang/kernels/aot/csrc/cpu/**', 'python/sglang/kernels/aot/include/**', 'python/sglang/kernels/aot/python/**', 'python/sglang/kernels/aot/pyproject_cpu.toml') }}
      - name: Build the unchanged CPU kernel package
        if: steps.cpu_wheel.outputs.cache-hit != 'true'
        run: uv build --wheel --no-build-isolation --out-dir "$RUNNER_TEMP/cpu-wheels" python/sglang/kernels/aot
      - uses: actions/cache/save@v4
        if: steps.cpu_wheel.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/cpu-wheels
          key: ${{ steps.cpu_wheel.outputs.cache-primary-key }}
      - name: Build missing Rust modules with the CPU runtime
        if: steps.rust_ext.outputs.hit != 'true'
        run: |
          uv pip install 'setuptools>=61.0' 'setuptools-rust>=1.11' 'setuptools-scm>=8.0'
          cd python
          SGLANG_BUILD_RUST_EXTS=all python setup.py build_rust --inplace
      - name: Verify compiled runtime and configure serving
        run: |
          uv pip install "$RUNNER_TEMP"/cpu-wheels/*.whl
          SGLANG_RUST_BUILD_MODE=never python - <<'PY'
          import importlib
          import torch
          from sglang.srt.utils import cpu_has_amx_support
          assert cpu_has_amx_support(), "runner cannot serve with AMX"
          for name in ("server", "grpc", "multimodal"):
              importlib.import_module("sglang.srt.rust_extensions._" + name)
          importlib.import_module("sglang.srt.mem_cache.rust_tree_core.mem_cache")
          PY
          echo 'SGLANG_RUST_BUILD_MODE=never' >> "$GITHUB_ENV"
          git restore python/pyproject.toml python/sglang/kernels/aot/pyproject.toml
          test -z "$(git status --porcelain)"
          python - <<'PY' >> "$GITHUB_ENV"
          import importlib.metadata as m
          import os
          libraries = [str(m.distribution("intel-openmp").locate_file(p).resolve()) for p in m.files("intel-openmp") if p.name == "libiomp5.so"]
          assert len(libraries) == 1, libraries
          print("LD_PRELOAD=" + libraries[0] + ":/usr/lib/x86_64-linux-gnu/libtcmalloc.so.4:/usr/lib/x86_64-linux-gnu/libtbbmalloc.so.2")
          print("SGLANG_CPU_OMP_THREADS_BIND=" + ",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))
          PY
      - name: Run matched serving accuracy, speed and profiling
        run: |
          set -euo pipefail
          cp -a test/ngram-cpu-serving "$RUNNER_TEMP/ngram-serving-harness"
          mkdir -p "$RUNNER_TEMP/ngram-serving-results"
          lscpu > "$RUNNER_TEMP/ngram-serving-results/cpu.txt"
          python -m pip freeze > "$RUNNER_TEMP/ngram-serving-results/dependencies.txt"
          git fetch --no-tags origin bd16c22a04b0eb9bc2e775795bda6b11727a5d38 17b250829c15b11563c0ff6098c97962ec6c2aa7
          python "$RUNNER_TEMP/ngram-serving-harness/serving.py" "$RUNNER_TEMP/ngram-serving-results"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngram-cpu-serving-results
          path: ${{ runner.temp }}/ngram-serving-results
          if-no-files-found: error
          retention-days: 7
